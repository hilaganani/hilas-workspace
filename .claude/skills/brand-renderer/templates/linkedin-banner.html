<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>{{FONT_FACES}}</style>
<style>{{TOKENS_CSS}}</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }
  body {
    position: relative;
    direction: rtl;
    background-image: url("{{BACKGROUND}}");
    background-size: cover;
    background-position: center;
  }
  /* wide format: text anchored to the right (natural Hebrew reading start),
     concept image stays visible on the left */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to left,
      rgba(73,49,142,0.95) 0%,
      rgba(73,49,142,0.88) 42%,
      rgba(73,49,142,0.35) 68%,
      rgba(73,49,142,0.05) 100%);
  }
  .content {
    position: absolute; z-index: 2;
    top: 0; bottom: 0; right: 0;
    width: 58%;
    display: flex; flex-direction: column; justify-content: center;
    align-items: flex-end;
    text-align: right;
    padding: 0 6% 0 4%;
    gap: 3%;
  }
  .headline {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.3;
    color: var(--white);
    text-wrap: balance;
  }
  .caption {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: {{CAPTION_SIZE}}px;
    color: var(--lavender);
  }
  .credit {
    position: absolute; z-index: 2;
    bottom: 5%; right: 6%;
    font-family: var(--font-body); font-weight: 700; font-size: {{CREDIT_SIZE}}px;
    color: var(--purple-light);
  }
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="content">
    <div class="headline">{{HEADLINE}}</div>
    <div class="caption">{{CAPTION}}</div>
  </div>
  <div class="credit">{{CREDIT}}</div>
</body>
</html>
