# Multi-channel strategy led by Yael. This is not the recurring Instagram production cycle;
# Instagram execution uses instagram-content-cycle.yaml.

id: monthly-content-strategy
workflow:
  name: monthly-content-strategy
  version: 2.0.0
  last_updated: 2026-08-19
description: >
  Builds a research-backed, SEO-informed multi-channel monthly strategy led by Yael.
  After Hila approves Yael's final plan, an Instagram component is handed to Gefen for
  platform-specific interpretation. This workflow does not dispatch Noga for Instagram,
  does not run the regular Instagram cycle, and does not make Yael a standing gateway for
  later Instagram work.

trigger:
  keywords_he: [תוכנית תוכן חודשית, תוכנית תוכן, תוכנית חודשית, אסטרטגיית תוכן, בנה תוכנית לחודש, תוכנית תוכן מלאה]
  keywords_en: [monthly content plan, monthly content strategy, monthly strategy, content strategy, build a content plan, full content plan]

deliverables:
  - yael_initial_strategy
  - liat_research
  - dani_seo_insights
  - yael_final_strategy
  - gefen_instagram_context_if_present

steps:
  - id: yael_initial_strategy
    agent: yael
    type: agent
    retry:
      max_attempts: 1
      on: [tool_error]

  - id: liat_research
    agent: liat
    type: agent
    depends_on: [yael_initial_strategy]
    inputs_from: [yael_initial_strategy]
    retry:
      max_attempts: 2
      on: [tool_error, empty_output]

  - id: dani_seo_insights
    agent: dani
    type: agent
    depends_on: [yael_initial_strategy]
    inputs_from: [yael_initial_strategy]
    retry:
      max_attempts: 2
      on: [tool_error, empty_output]

  - id: yael_final_strategy
    agent: yael
    type: agent
    depends_on: [liat_research, dani_seo_insights]
    inputs_from: [yael_initial_strategy, liat_research, dani_seo_insights]
    retry:
      max_attempts: 1
      on: [tool_error]

  # This gate approves the multi-channel plan. The step runs only when that approved plan
  # actually contains an Instagram component. Gefen receives business context; she is not
  # being asked to write the monthly plan's Instagram deliverables inside this workflow.
  - id: gefen_instagram_context
    agent: gefen
    type: agent
    depends_on: [yael_final_strategy]
    inputs_from: [yael_final_strategy]
    run_if: has_instagram_component
    awaits_human_approval: true
    retry:
      max_attempts: 1
      on: [tool_error]

  - id: combine
    type: synthesis
    depends_on: [yael_final_strategy, gefen_instagram_context]
    inputs_from: [yael_final_strategy, gefen_instagram_context]

completion_criteria:
  - Yael remains the owner of the multi-channel business strategy
  - Gefen runs only when has_instagram_component is true and only after Hila approves the final multi-channel plan
  - the approved Instagram context is handed to Gefen without dispatching Noga for Instagram
  - no Instagram deliverable is produced or published by this workflow; recurring execution uses instagram-content-cycle
  - later Instagram cycles do not require Yael unless product, service, audience, offer, launch, business objective or multi-channel strategy changes

# A revision request at the human gate remains handled conversationally by Roi because the
# current workflow schema has no revision_target field. No new engine field is introduced.
