# Agent Registry — single source of truth for "which agents exist and what they can do."
#
# This file exists to close a duplication problem found during the orchestration
# architecture review (see architecture/02-architecture-review.md §3 and
# architecture/10-design-review-addendum.md §4): agent routing information used to
# live redundantly in CLAUDE.md's roster table, roi.md's own persona prose, and
# PRD-roi.md, with no single source of truth.
#
# Roi reads this file (via Read) when planning a workflow-config-driven run
# (architecture/04-orchestrator-design.md) and when falling back to standalone
# single-agent dispatch. It does not replace any agent's persona file — persona
# files remain the source of truth for HOW an agent does its work; this file is
# the source of truth for WHAT each agent accepts, produces, and depends on.
#
# Schema per agent, per architecture/11-agent-contract-and-registry.md §4:
#   id, status, persona_path, domain, capabilities, accepted_inputs
#     (required/optional/implicit), produced_outputs, typical_dependencies,
#     required_tools, optional_integrations

agents:
  - id: roi
    status: active
    persona_path: .claude/agents/roi.md
    domain: orchestration
    capabilities:
      - workflow planning and dispatch
      - multi-agent result synthesis
    accepted_inputs:
      required: [user_request]
      optional: []
      implicit: [.claude/agents/_registry.yaml, .claude/workflows/*.yaml]
    produced_outputs:
      - unified report to user (no domain artifacts of its own)
    typical_dependencies: []
    required_tools: [Agent, Read, Glob, Grep, Write, TaskCreate, TaskUpdate, TaskList, TaskGet]
    optional_integrations: []

  - id: liat
    status: active
    persona_path: .claude/agents/liat.md
    domain: trend research (marketing & automation)
    capabilities:
      - live web research
      - source quality filtering
      - 30-day dedup memory
    accepted_inputs:
      required: [topic_or_keywords]
      optional: []
      implicit: [liat/Memory/searches.md]
    produced_outputs:
      - path: "Content/<YYYY-MM-DD>-<slug>.md"
        type: final
    typical_dependencies: []
    required_tools: [WebSearch, WebFetch, Read, Write, Edit, Glob, Grep]
    optional_integrations: []

  - id: noga
    status: active
    persona_path: .claude/agents/noga.md
    domain: content writing
    capabilities:
      - newsletter/blog/LinkedIn/Facebook/TikTok copywriting
      - Instagram copywriting only when Hila explicitly assigns it to Noga
      - rewriting from a source article
      - smoove-newsletter (draft-only campaign creation)
    accepted_inputs:
      required: [source_file_or_direct_brief]
      optional: [liat_research_file, seo_pre_write_brief, explicit_instagram_assignment_from_hila]
      implicit: [noga/style-guide.md, noga/reference/]
    produced_outputs:
      - path: "output/<name>.md"
        type: final
      - path: "output/<name>.html"
        type: final
      - path: "Smoove draft campaign (external)"
        type: final
        note: "separate step, on explicit request only, never sent"
    typical_dependencies: [liat, dani]
    required_tools: [Read, Write, Edit, Glob, Grep, Bash]
    tool_scope_notes:
      Bash: "scoped to smoove-newsletter skill only, separate step from writing"
    optional_integrations:
      - name: smoove
        env: [SMOOVE_API_KEY, SMOOVE_LIST_ID]
        degrades: "newsletter stays a local file only, no draft campaign created"

  - id: merav
    status: active
    persona_path: .claude/agents/merav.md
    domain: visual generation
    capabilities:
      - image generation (gpt-image-2)
      - image editing (real photo / logo compositing)
    accepted_inputs:
      required: [image_brief]
      optional: [brand_guidelines_applicability, source_photo_requirement]
      implicit: [merav/reference/, merav/brand-guidelines.md]
    produced_outputs:
      - path: "merav/outputs/{carousels,stories,singles,blog,archive}/<YYYY-MM-DD>-<slug>.png"
        type: final
      - path: "merav/outputs/<YYYY-MM-DD>-<slug>.txt"
        type: side
        note: "prompt used, flat at outputs/ root"
    typical_dependencies: [noga, gefen]
    required_tools: [Read, Write, Bash, Glob]
    tool_scope_notes:
      Bash: "scoped to gpt-image-gen and brand-renderer skills only"
    optional_integrations: [brand-renderer]

  - id: dani
    status: active
    persona_path: .claude/agents/dani.md
    domain: SEO
    capabilities:
      - seo-keyword-research
      - seo-serp-analysis
      - seo-content-brief
      - seo-on-page-audit
      - seo-internal-linking
      - seo-technical-audit
      - seo-content-refresh
      - seo-competitor-analysis
      - seo-content-planning
      - seo-strategy-advisor
      - google-search-console (optional data upgrade)
      - airtable publish-log (create-only)
    accepted_inputs:
      required: [topic_or_brief_pre_write, OR_finished_draft_post_write]
      optional: [liat_research_file, pre_write_brief_for_comparison]
      implicit: []
    produced_outputs:
      - path: "dani/outputs/<name>-seo.md"
        type: final
      - path: "dani/outputs/{technical-audits,content-refresh,competitor-analyses,content-planning,strategy}/<YYYY-MM-DD>-<slug>.md"
        type: final
      - path: "Airtable record (existing-content table)"
        type: final
        note: "create-only, publish-report trigger only"
    typical_dependencies: [noga]
    required_tools: [WebSearch, WebFetch, Read, Write, Edit, Glob, Grep, Bash]
    tool_scope_notes:
      Bash: "scoped to exactly five uses — airtable-read, airtable-write (publish-log only), readability_he.py, optional PageSpeed curl, optional gsc_query.py"
    optional_integrations:
      - name: pagespeed
        env: [PAGESPEED_API_KEY]
        degrades: "Core Web Vitals section skipped in seo-technical-audit, reported as such"
      - name: google_search_console
        env: [GOOGLE_SEARCH_CONSOLE_KEY_FILE, GOOGLE_SEARCH_CONSOLE_SITE_URL]
        degrades: "seo-content-refresh and seo-technical-audit stay in inference-based degraded mode"

  - id: yael
    status: active
    persona_path: .claude/agents/yael.md
    domain: strategic advisor
    capabilities:
      - multi-channel content planning
      - business/product/audience/offer/launch strategy
      - strategic-fit gate for new topics
      - plan-vs-actual item seeding (create-only, Airtable content calendar)
      - plan-vs-actual insight synthesis for the next monthly plan
    accepted_inputs:
      required: [period_to_plan, OR_topic_to_gate]
      optional: []
      implicit: [yael/strategy.md, "תכנון תוכן חודשי Airtable table (history)"]
    produced_outputs:
      - path: "yael/outputs/<YYYY-MM>-content-plan.md"
        type: final
      - path: "yael/outputs/<YYYY-MM>-content-plan.docx"
        type: final
      - gate_verdict: [fits, needs_adjustment, new_strategic_move]
        type: domain_verdict
        note: "no file — a decision, not an artifact"
      - airtable_rows: "one row per content item, status מתוכנן, in תכנון תוכן חודשי (tbl86pJ76WWc3moL2)"
        type: final
        note: "create-only, via airtable-content-calendar — Yael never runs its update-items action"
    typical_dependencies: []
    required_tools: [Read, Write, Edit, Glob, Grep, Bash]
    tool_scope_notes:
      Bash: "scoped to airtable-read (read-only), docx-export, and airtable-content-calendar's create-items action only — never update-items"
    optional_integrations: []

  - id: gefen
    status: active
    persona_path: .claude/agents/gefen.md
    domain: Instagram strategy and content
    capabilities:
      - Instagram account diagnosis and strategy
      - Instagram content planning and pillar management
      - Reel, Carousel, Caption, Story, CTA and filming-script writing
      - visual briefs for Merav
      - reference-content reverse engineering
      - performance analysis, experiments and cycle learning
      - multi-source Instagram performance interpretation
      - session recovery from shared sources of truth
    accepted_inputs:
      required: [instagram_request]
      optional: [reference_screenshot_or_url, published_content_evidence, insights_data, business_context_from_yael]
      implicit: [instagram/current-state.md, instagram/master-brief.md, instagram/content-pillars.md, instagram/content-bank.md, instagram/highlights.md]
    produced_outputs:
      - instagram_strategy_or_diagnosis
      - instagram_content_plan
      - finished_instagram_copy
      - reference_content_analysis
      - visual_brief_for_merav
      - performance_learning_recommendations
    typical_dependencies: []
    required_tools: [WebSearch, WebFetch, Read, Write, Edit, Glob, Grep]
    optional_integrations:
      - name: attached_image_vision
        degrades: "If the screenshot is not exposed to the agent as an image or readable local file, request re-attachment or a text description"
      - name: instagram_live_url_access
        degrades: "Instagram often blocks WebFetch; use an accessible public page, screenshots, transcript, or supplied text instead"
      - name: instagram_ops_and_insights
        status: google_sheets_implemented
        degrades: "If Google Sheets access is unavailable, Instagram Ops reports the gap and uses supplied exports/screenshots without inventing persistent state"

  - id: instagram-ops
    status: active
    persona_path: .claude/agents/instagram-ops.md
    domain: Instagram operations and measurement
    capabilities:
      - active execution-plan tracking
      - Content ID, date, status, link, asset and blocker management
      - read-only Instagram Insights collection when runtime access exists
      - Google Sheets operational reads and approved factual updates
      - read-only Search Console evidence collection
      - factual performance reports for Gefen
      - operational current-state maintenance
    accepted_inputs:
      required: [operational_or_measurement_request]
      optional: [content_ids, date_range, supplied_exports_screenshots_or_reports]
      implicit: [instagram/current-state.md, instagram/content-bank.md, instagram/master-brief.md]
    produced_outputs:
      - factual_performance_report
      - operational_current_state_update
      - missing_data_and_setup_report
    typical_dependencies: []
    required_tools: [Read, Write, Edit, Glob, Grep, WebFetch, Bash]
    tool_scope_notes:
      Bash: "read-only airtable-read for non-Instagram legacy sources and google-search-console only"
      Write_Edit: "performance reports and operational sections of instagram/current-state.md only"
    optional_integrations:
      - name: google_sheets_instagram_operations
        status: implemented
      - name: google_search_console
        status: read_only_available_with_local_credentials
      - name: connected_chrome_instagram_insights
        status: runtime_dependent
        degrades: "Use exports/screenshots or report blocked_needs_setup; repository does not provide a guaranteed Chrome tool"
      - name: instagram_operations_and_performance_sheets
        status: implemented

  - id: tamar
    status: active
    persona_path: .claude/agents/tamar.md
    domain: sales proposals and pricing
    capabilities:
      - proposal drafting from a call transcript and/or brief
      - pricing per catalog and business rules
      - reuse of structure/wording from past Prospero proposals
      - revenue-mix and capacity oversight toward the 100K target
    accepted_inputs:
      required: [call_transcript_OR_brief]
      optional: [client_name, existing_deal_record_id]
      implicit:
        - tamar/pricing-rules.md
        - tamar/product-details.md
        - tamar/proposals/INDEX.md
        - tamar/proposal-template.md
        - "מוצרים table in Mini CRM (appcfuP4ufqhwipBm), read live"
    produced_outputs:
      - path: "tamar/outputs/<YYYY-MM-DD>-<client>-proposal.md"
        type: final
      - airtable_deal_update: "מחיר העסקה / תיאור / מוצרים / Stage / סיכום לקראת שיחה in עסקאות (tbl3dP8utT9rgw0AT)"
        type: final
        note: "only after Hila confirms in chat that the proposal was actually sent — a draft is not a deal"
    typical_dependencies: []
    required_tools: [Read, Write, Edit, Glob, Grep, Bash]
    tool_scope_notes:
      Bash: "scoped to .claude/skills/crm-deals/scripts/crm_deals.py only — no other scripts, no other API calls"
    optional_integrations: []
    note: >
      Single-domain by design — dispatched directly, not through Roi (per
      CLAUDE.md's "when to dispatch Roi" rule). Never sends a proposal and never
      creates one in Prospero; Hila copies the draft over herself. The Mini CRM
      base is NOT the base AIRTABLE_BASE_ID points at.

  - id: bar
    status: planned
    persona_path: null
    domain: LinkedIn marketing
    capabilities: []
    accepted_inputs: {}
    produced_outputs: []
    typical_dependencies: []
    required_tools: []
    optional_integrations: []
    note: >
      Not built. architecture/07-agent-review.md §3 recommends against building
      this as a standing agent — LinkedIn publishing+analytics should become a
      shared tool/skill Noga and Dani can both call, not a 7th persona. Kept as a
      registry entry (status: planned) rather than removed, so Roi's fallback
      "TBD — stop and report" behavior (roi.md) continues to work unchanged.
